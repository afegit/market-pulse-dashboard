name: Update Market Pulse

on:
  schedule:
    # 米国市場の引け後（JST 07:17、夏時間/冬時間とも米国東部の引け後）に実行する。
    - cron: '17 22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-pulse-daily-update
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Generate dashboard data
        run: dotnet run --configuration Release

      - name: Commit refreshed data when it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json history.json
          git diff --cached --quiet || git commit -m "chore: refresh market pulse data"
          git push
