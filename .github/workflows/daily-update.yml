name: Daily .NET Market Pulse Update

on:
  schedule:
    # 米国市場クローズ後、日次データが確定してから取得するため少し余裕を持たせて実行
    # UTC 22:30 = JST 翌7:30（メイン）
    - cron: '30 22 * * 1-5'
    # 保険用：GitHub Actions側のスケジュール実行が数時間規模で遅延することがあるため、
    # メインから6時間後（UTC 4:30 = JST 13:30）にも実行し、メインが遅延・スキップされた場合に備える。
    # 同日に2回実行されても、data.json/history.jsonは日付キーで上書きされるだけなので害はない。
    - cron: '30 4 * * 2-6'
  workflow_dispatch: # 手動実行ボタン

permissions:
  contents: write

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Run .NET App (Generate data.json / history.json)
        run: dotnet run

      - name: Commit and Push data.json / history.json
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Automated daily update of Market Pulse data"
          file_pattern: 'data.json history.json'
