name: Daily .NET Market Pulse Update

on:
  schedule:
    # 【注意】GitHub Actions純正のscheduleトリガーは「ベストエフォート」であり、
    # 高負荷時には遅延するだけでなく実行自体がドロップ（消失）することが公式にも認められている。
    # このため、確実な自動実行は外部サービスからworkflow_dispatch APIを叩く方式に移行した
    # （設定手順は RELIABLE_SCHEDULING_GUIDE.md を参照）。
    # これはあくまで「動けば儲けもの」の無料の保険であり、これ単体には依存しない。
    # 分の値を:00/:30から外し、他の大量のワークフローと混雑するタイミングを避けている。
    - cron: '17 22 * * 1-5'
  workflow_dispatch: # 手動実行ボタン（外部cronサービスもこのイベントを呼び出す）

permissions:
  contents: write

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Run .NET App (Generate data.json / history.json)
        run: dotnet run

      - name: Commit and Push data.json / history.json
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Automated daily update of Market Pulse data"
          file_pattern: 'data.json history.json'
